[project]
name = "isric-soilgrids-data"
version = "0.1.0"
description = "End-to-end pipeline: ISRIC SoilGrids v2.0 250 m -> Icechunk Zarr store on Source Cooperative"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "icechunk>=2.1",
    "zarr>=3.3",
    "xarray>=2026.7.0",
    "rioxarray>=0.22.0",
    "rasterio>=1.5.0",
    "numpy>=2.0",
    "pyarrow>=25.0.0",
    "polars>=1.43.0",
    "pyproj>=3.7",
    "pydantic>=2.10",
    "typer>=0.15",
    "boto3>=1.43",
    "tqdm>=4.69.0",
    "httpx>=0.28",
    # pinned: 0.x and marked experimental; its fill-value resolution and level
    # encodings are relied on precisely (see docs/data-reference.md)
    "topozarr==0.1.6",
    "xproj>=0.2.1",
]

[project.scripts]
soilgrids = "soilgrids.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "ruff>=0.8",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/soilgrids"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
